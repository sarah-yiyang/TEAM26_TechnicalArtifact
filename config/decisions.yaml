# Decision map for insight checks (recommend.py).
# Staff can edit wording here without touching code.
#
# Rules
# - lever / secondary_lever: curriculum_content, presenter_coaching,
#   audience_targeting, language_access, scheduling_format, survey_design,
#   funder_reporting
# - {placeholders} are filled ONLY from the card's evidence. Values arrive
#   already formatted (percentages include "%"), so don't add "%" after them.
# - No number may appear in a template unless it is in allowed_literals.
# - rule = what makes the check flag (shown in Checks run, so results can be verified).
# - too_few = why a check could not run; {n} is the number that fell short.
# - Every check's evidence also has {threshold} and {min_n}.
# - decision = the yes/no choice the owner makes, phrased as "Should we ...?".
#   It may use {placeholders} from evidence, like the other texts.
# - finding.text = what we found; finding.action = options to consider (not
#   instructions); finding.success_measure = what success looks like (a measurable target).
# - owner_role is an area of responsibility, not a job title, since we don't know
#   who does what at EveryMind. EveryMind confirms each one (confirmed: false).
#   Leave a check out entirely if nobody owns it: the card shows "Not assigned".

version: 1

allowed_literals: ["988", "911"]     # service names, not statistics

labels:
  metrics:
    agree_pct.post_when: know when to use 988 (agree)
    mean_change.when: self-reported change in knowing when to use 988
    nps: would-recommend score (NPS)
    likely_call.pct_high: very likely to call 988
    delivery_agree_pct: liked the delivery
  fields:
    pre_identify: could identify mental health challenges (before)
    pre_describe: could describe 988 (before)
    pre_when: knew when to use 988 (before)
    post_identify: can identify mental health challenges
    post_describe: can describe 988
    post_when: know when to use 988
    presenter_engaged: presenter engaged participants
    presenter_knew: presenter knew the subject
    well_organized: training was well organized
    nps: would recommend
    likely_call: likely to call 988
    comment_valuable: "'most valuable' comment box"
    comment_improve: "'how to improve' comment box"
  words:
    above: above
    below: below

checks:
  A:
    question: >
      Did the score change only because a different mix of people attended?
    decision: >
      Should reports on "{metric_label}" show the role-adjusted trend next to
      the reported one?
    lever: funder_reporting
    secondary_lever: audience_targeting
    owner_role: Program reporting
    confirmed: false
    rule: >
      Flags when the reported change and the change after adjusting for each
      month's mix of roles (students, school staff, caregivers, community)
      differ by {threshold} or more, comparing the first and last months that
      each have at least {min_n} answers.
    too_few: >
      Needs at least two months with {min_n} or more answers each; {months_ok}
      months qualify (the largest month has {n} answers).
    finding:
      text: >
        From {first_month} to {last_month}, "{metric_label}" changed by
        {raw_change} as reported, but by {adjusted_change} after adjusting for
        the mix of roles who attended ({n_first} answers in {first_month},
        {n_last} in {last_month}). Part of the reported change likely reflects
        who was trained, not how well the training worked.
      action: >
        Consider showing both the reported and the role-adjusted trend
        whenever this result is shared, so the change is not credited to, or
        blamed on, the training itself.
      success_measure: >
        The next report shows both trends side by side, and the gap between
        them is under {target_gap}.
    no_finding:
      text: >
        From {first_month} to {last_month}, "{metric_label}" changed by
        {raw_change} as reported and {adjusted_change} after adjusting for the
        mix of roles, a difference under {threshold} ({n} answers across the
        two months).

  B:
    question: >
      Do people know when to use 988 but still wouldn't call?
    decision: >
      Should we add content on what stops people from calling: what happens on
      a call, confidentiality, and when to call 911 vs 988?
    lever: curriculum_content
    owner_role: Curriculum
    confirmed: false
    rule: >
      Flags when {threshold} or more of respondents agree they know when to
      use 988 but rate their chance of calling {call_cutoff} or lower out of
      {call_max}.
    too_few: >
      Only {n} people answered both the 'know when to use 988' question and
      the 'likely to call' question; at least {min_n} are needed.
    finding:
      text: >
        {gap_pct} of respondents ({gap_n} of {n}) agree they know when to use
        988 but rate their chance of calling {call_cutoff} or lower out of
        {call_max}. Knowing when to call is not yet turning into intent to
        call.
      action: >
        Consider adding a short segment on what holds people back: what
        happens when you call, whether the call is confidential, and when to
        call 911 instead of 988.
      success_measure: >
        Next quarter, fewer than {target_pct} of respondents know when to use
        988 but rate their chance of calling {call_cutoff} or lower, with at
        least {min_n} responses.
    no_finding:
      text: >
        {gap_pct} of respondents ({gap_n} of {n} who answered both questions)
        know when to use 988 but rate their chance of calling {call_cutoff} or
        lower, under the {threshold} threshold.

  C:
    question: >
      Is how the training was delivered more linked to intent to call than
      what people learned?
    decision: >
      Should we invest in presenter coaching or peer observation, starting
      with "{top_delivery_item}"?
    lever: presenter_coaching
    owner_role: Training
    confirmed: false
    rule: >
      Flags when the delivery question most linked to likelihood of calling is
      ahead of the most-linked knowledge question by {threshold} or more (rank
      correlation; higher means a stronger link).
    too_few: >
      Only {n} people answered every delivery and knowledge question plus the
      'likely to call' question; at least {min_n} are needed.
    finding:
      text: >
        Likelihood of calling tracks how the training was delivered more than
        what people learned. The strongest delivery question,
        "{top_delivery_item}", has a link of {delivery_link}, versus
        {knowledge_link} for the strongest knowledge question (rank
        correlation; higher means a stronger link; n = {n}). This shows a
        link, not cause and effect.
      action: >
        Consider whether presenter coaching or peer observation, focused on
        "{top_delivery_item}", is worth investing in.
      success_measure: >
        The share of respondents who agree with every delivery question rises
        from {delivery_agree_pct} to {target_pct} next quarter.
    no_finding:
      text: >
        The strongest delivery question has a link of {delivery_link} with
        likelihood of calling, versus {knowledge_link} for the strongest
        knowledge question: not ahead by {threshold} or more (at least {n}
        answers per question).

  D:
    question: >
      Did many people already give the top score before training?
    decision: >
      Should we reword the before-training question on "{item_label}" so the
      survey can show growth for people who already start at {top_score} of
      {top_score}?
    lever: audience_targeting
    secondary_lever: survey_design
    owner_role: Curriculum
    confirmed: false
    rule: >
      Flags when {threshold} or more of respondents gave the top score
      ({top_score} of {top_score}) on any before-training question.
    too_few: >
      Only {n} people answered the before-training questions; at least {min_n}
      are needed.
    finding:
      text: >
        {ceiling_pct} of respondents (n = {n}) rated themselves {top_score} of
        {top_score} on "{item_label}" before training. They cannot report any
        improvement, so the before/after change understates what the training
        does for them.
      action: >
        Options to consider: reword the before-training question so fewer
        people choose the top answer (for example, ask about a specific
        skill), or offer a more advanced version for groups that already know
        the basics.
      success_measure: >
        In the next survey round, fewer than {target_pct} of respondents rate
        themselves {top_score} of {top_score} on "{item_label}" before
        training.
    no_finding:
      text: >
        The before-training question with the most top scores was
        "{item_label}", at {ceiling_pct} ({n} answers), under the {threshold}
        threshold.

  E:
    question: >
      Is a score low only because many people left the question blank?
    decision: >
      Should we change how "{question_label}" appears on the survey so fewer
      people skip it?
    lever: survey_design
    owner_role: Survey Design
    confirmed: false
    rule: >
      Flags when a question is left blank in {threshold} or more of a month's
      responses, and in at least {jump} more than in other months.
    too_few: >
      No month has {min_n} or more responses (the largest month has {n}), so
      blank rates cannot be compared by month.
    finding:
      text: >
        In {month}, {blank_pct} of the {n} responses left "{question_label}"
        blank, far more than in other months. That month's score for this
        question rests on fewer answers; blanks are not counted as
        disagreement.
      action: >
        Consider checking whether the question was hidden, moved, or easy to
        miss in that month's survey, or making it required.
      success_measure: >
        Next month, fewer than {target_pct} of responses leave
        "{question_label}" blank.
    no_finding:
      text: >
        No question was left blank in {threshold} or more of any month's
        responses ({n} responses across months with at least {min_n}).

  F:
    question: >
      Are people who gave a low rating silent about why?
    decision: >
      Should we add a follow-up question asking people who give a low rating
      what would have made the training better?
    lever: survey_design
    owner_role: Survey Design
    confirmed: false
    rule: >
      Flags when {threshold} or more of people who rated "would recommend"
      {low_cutoff} or lower left no comment.
    too_few: >
      Only {n} people rated "would recommend" {low_cutoff} or lower; at least
      {min_n} are needed.
    finding:
      text: >
        {silent_pct} of the {low_n} people who rated "would recommend"
        {low_cutoff} or lower left no comment, so we do not know what
        disappointed them.
      action: >
        Consider adding a short follow-up that appears only after a low
        rating, such as "What would have made this training better?"
      success_measure: >
        After the follow-up is added, fewer than {target_pct} of people who
        rate {low_cutoff} or lower leave no comment.
    no_finding:
      text: >
        {silent_pct} of the {low_n} people who rated "would recommend"
        {low_cutoff} or lower left no comment, under the {threshold}
        threshold.

  G:
    question: >
      Are fewer people writing comments?
    decision: >
      Should we change when or how the survey is handed out so people have
      time to write comments?
    lever: survey_design
    owner_role: Survey Design
    confirmed: false
    rule: >
      Flags when the share of responses with a comment in the latest month is
      {threshold} or more below earlier months.
    too_few: >
      Needs at least two months with {min_n} or more responses each;
      {months_ok} months qualify (the largest month has {n}).
    finding:
      text: >
        Fewer people are filling in the {field_label}: {late_rate} of {n_late}
        responses in {late_month}, versus {early_rate} of {n_early} in earlier
        months.
      action: >
        Consider whether the survey's timing or format changed in
        {late_month}, for example handed out as people were leaving, or the
        comment box moved to a later page.
      success_measure: >
        Next quarter, the share of responses with a comment returns to
        {target_pct} or higher.
    no_finding:
      text: >
        The latest month's comment rate is within {threshold} of earlier
        months ({n} responses across months with at least {min_n}).

  H:
    question: >
      Did any session score far outside the normal range for its size?
    decision: >
      Should we review the context of session {session_label} (audience, room,
      timing, logistics) with its presenter?
    lever: presenter_coaching
    secondary_lever: scheduling_format
    owner_role: Training
    confirmed: false
    rule: >
      Flags a session whose score falls outside the {threshold} control limits
      for its size, which is unlikely to happen by chance. Limits are wider
      for smaller sessions.
    too_few: >
      No session has {min_n} or more answers (the largest has {n}).
    finding:
      text: >
        Session {session_label} ({n} responses) scored {session_value} on
        "{metric_label}", {limit_side} the expected range for a session of its
        size (average across sessions: {centre}). Many things can explain
        this, such as the audience, room, time of day, or logistics.
      action: >
        Consider reviewing the session's context with the presenter to learn
        what was different, and whether it is worth repeating or adjusting.
      success_measure: >
        Notes from a context review with the presenter are recorded before the
        next session in {county}.
    no_finding:
      text: >
        All sessions with {min_n} or more answers scored inside the
        {threshold} limits for their size.

  I:
    question: >
      Do flagged responses (rushed, same answer to every question, or
      contradictory) change the headline numbers?
    decision: >
      Should funder reports state whether flagged responses are included?
    lever: funder_reporting
    secondary_lever: survey_design
    owner_role: Survey Design
    confirmed: false
    rule: >
      Flags when leaving out flagged responses moves a headline number by
      {threshold} or more ({threshold_nps} points for NPS).
    too_few: >
      Only {n} responses in total; at least {min_n} are needed to compare
      headline numbers.
    finding:
      text: >
        Leaving out the {flagged_n} flagged responses ({flagged_pct} of {n}:
        completed very fast, same answer to every question, or contradictory)
        changes "{metric_label}" from {with_flags} to {without_flags}.
      action: >
        Consider stating in every report whether flagged responses are
        included. If many were completed very fast, consider giving
        participants a few more minutes to fill in the survey.
      success_measure: >
        Next quarter, flagged responses fall below {target_pct} of all
        responses, and every report states whether they are included.
    no_finding:
      text: >
        Leaving out the {flagged_n} flagged responses (of {n}) moves no
        headline number by {threshold} or more.

  J:
    question: >
      Are people asking questions the training didn't answer?
    decision: >
      Should we answer "{top_topic}" questions in the session or in a take-home handout?
    lever: curriculum_content
    owner_role: Curriculum
    confirmed: false
    rule: >
      Flags when {threshold} or more of written comments ask a question the
      training may not have answered.
    too_few: >
      Only {n} written comments; at least {min_n} are needed.
    finding:
      text: >
        {question_n} of {comment_n} written comments ask a question the
        training may not have answered. The most common topic was
        "{top_topic}" ({top_topic_n} comments).
      action: >
        Consider adding a short answer on "{top_topic}" to the session, or to
        a handout or FAQ participants take home.
      success_measure: >
        Next quarter, fewer than {target_n} comments ask about "{top_topic}".
    no_finding:
      text: >
        {question_n} of {comment_n} written comments ask a question the
        training may not have answered, under the {threshold} threshold.

brief:
  title: "988 awareness training: program brief"
  audiences:
    internal: Internal (all findings)
    funder: Funder / report
  intro: >
    Based on {rows} survey responses from {first_month} to {last_month}.
    Rushed or patterned responses are {flag_state}.
  intro_no_months: >
    Based on {rows} survey responses. Rushed or patterned responses are
    {flag_state}.
  flag_states: {included: included, excluded: left out}
  n_label: "n = {n}"
  headings:
    bottom_line: Bottom line
    scorecard: Scorecard
    priorities: Top priorities
    watch: Also worth a look
    reach: Who the training reaches
    comments: What participants say
    measurement: Fix the measurement
    limits: How to read this
  blurbs:
    scorecard: One line per training goal. Trend = the latest month against the months before it.
    priorities: The strongest findings first. Each is an option to consider, not an instruction.
    watch: Findings with thin evidence, or beyond the top three. Re-check them on the next upload.
    reach: 'Who took part, and whether any group differs on "{metric_label}".'
    comments: The most common topics in participants' own words (redacted).
    measurement: Gaps in the survey itself. Fixing these makes every other number more reliable.
  bottom_line:
    knowledge: >
      Self-reported "{label}" went from {before} before the training to
      {after} after (n = {n}).
    intent: >
      {value} say they are very likely to call 988 (n = {n}).
    intent_low_coverage: >
      {value} say they are very likely to call 988, but only {coverage} of
      respondents answered that question (n = {n}).
    gap: "Biggest gap: {text}"
    declines: "Watch: in {month}, {items} fell compared with earlier months."
    action: "First step to consider ({owner}): {action}"
    none: No insight check found a gap to act on in this data.
    none_strong: >
      No finding is strong enough to act on yet; {watch_n} with thin evidence
      are listed under "Also worth a look".
  scorecard:
    - {label: Can identify mental health challenges, before: agree_pct.pre_identify, after: agree_pct.post_identify}
    - {label: Can describe 988 and how it works, before: agree_pct.pre_describe, after: agree_pct.post_describe}
    - {label: Know when to use 988, before: agree_pct.pre_when, after: agree_pct.post_when, trend: agree_pct.post_when}
    - {label: Very likely to call 988, after: likely_call.pct_high, trend: likely_call.pct_high, coverage: likely_call.coverage}
    - {label: Would recommend (NPS), after: nps, trend: nps, format: score}
    - {label: Liked the delivery, after: delivery_agree_pct, trend: delivery_agree_pct}
  tile:
    before_after: "{before} before, {after} after"
    coverage: "answered by {coverage} of respondents"
    score_range: "likely range {low} to {high}"
    trend_up: "up {change} in {last_month} vs earlier months"
    trend_down: "down {change} in {last_month} vs earlier months"
    trend_steady: "steady in {last_month} vs earlier months"
    trend_none: not enough months for a trend
    not_collected: not collected
    too_few: too few responses
    target_met: "target {target}: met"
    target_missed: "target {target}: not yet met"
    points: "{x} points"
  targets: {}
  card:
    evidence: "{n_label}, {confidence} evidence"
    action_label: "Option to consider:"
    owner_label: "Responsible area:"
    success_label: "Success looks like:"
  reach:
    metric_label: know when to use 988 (agree)
    dims:
      - {by: role_primary, label: Role}
      - {by: language, label: Language}
      - {by: county, label: County}
    largest: "Largest group: {group}, {share} of respondents ({n} of {total})."
    gap: "{group} is at {value} vs {overall} overall (n = {n})."
    no_gap: "No group differs from the overall {overall} by {threshold} or more."
    too_few: "Too few responses to judge: {groups}."
    not_recorded: "{n} responses have no {label} recorded."
    not_collected: "{label} was not collected in this survey."
  comments:
    coverage: >
      Based on the {sorted_n} of {total_n} comments ({coverage}) that matched
      a topic; the rest are listed as "Other" on the comment board.
    topic: '{topic} ({n}): "{quote}"'
    columns:
      Keep: "Keep: what people valued"
      Fix: "Fix: what people would change"
      Add: "Add: questions the training left open"
    column_none: No comments matched a topic here.
    none: No comments to summarize.
  measurement:
    coverage: >
      "Very likely to call 988" was answered by only {coverage} of
      respondents ({n} of {rows}), so the outcome that matters most rests on
      a minority of people.
    coverage_action: >
      Consider making this question required, or moving it earlier in the
      survey.
    none: No gaps found in how the survey is measuring.
  limits:
    - >
      Before-and-after ratings are given on the same survey after training,
      so they show how people see their own change, not measured impact.
    - Comments come only from people who chose to write one.
    - There is no comparison group of people who did not attend.
    - Groups with fewer than {min_n} responses are not judged.
  funder_hide_levers: [presenter_coaching]
  funder_hide_checks: [H]
