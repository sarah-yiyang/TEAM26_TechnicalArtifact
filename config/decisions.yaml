# Decision map for insight checks (recommend.py).
# Staff can edit wording here without touching code.
#
# Rules
# - lever / secondary_lever: curriculum_content, presenter_coaching,
#   audience_targeting, language_access, scheduling_format, survey_design,
#   funder_reporting
# - {placeholders} are filled ONLY from the card's evidence. Values arrive
#   already formatted (percentages include "%"), so don't add "%" after them.
# - No number may appear in a template unless it is in allowed_literals.
# - rule = what makes the check flag (shown in Checks run, so results can be verified).
# - too_few = why a check could not run; {n} is the number that fell short.
# - Every check's evidence also has {threshold} and {min_n}.
# - decision = the yes/no choice the owner makes, phrased as a question.
# - finding.text = what we found; finding.action = options to consider (not
#   instructions); finding.success_measure = what success looks like (a measurable target).
# - owner_role is an area of responsibility, not a job title, since we don't know
#   who does what at EveryMind. EveryMind confirms each one (confirmed: false).
#   Leave a check out entirely if nobody owns it: the card shows "Not assigned".

version: 1

allowed_literals: ["988", "911"]     # service names, not statistics

labels:
  metrics:
    agree_pct.post_when: know when to use 988 (agree)
    mean_change.when: self-reported change in knowing when to use 988
    nps: would-recommend score (NPS)
    likely_call.pct_high: very likely to call 988
    delivery_agree_pct: liked the delivery
  fields:
    pre_identify: could identify mental health challenges (before)
    pre_describe: could describe 988 (before)
    pre_when: knew when to use 988 (before)
    post_identify: can identify mental health challenges
    post_describe: can describe 988
    post_when: know when to use 988
    presenter_engaged: presenter engaged participants
    presenter_knew: presenter knew the subject
    well_organized: training was well organized
    nps: would recommend
    likely_call: likely to call 988
    comment_valuable: most valuable comment
    comment_improve: how to improve comment
  words:
    above: above
    below: below

checks:
  A:
    question: Did the score change only because the audience changed?
    decision: Report this trend with the audience-adjusted line next to it?
    lever: funder_reporting
    secondary_lever: audience_targeting
    owner_role: Program reporting
    confirmed: false
    rule: >
      Flags when the as-reported and audience-adjusted change, from the
      first to the last month with enough answers, differ by {threshold} or
      more.
    too_few: >
      Needs two months with at least {min_n} answers each; {months_ok}
      qualify (largest month: {n} answers).
    finding:
      text: >
        From {first_month} to {last_month}, "{metric_label}" moved
        {raw_change}. After accounting for who attended, it moved
        {adjusted_change} (n = {n_first} and {n_last}). Part of the change
        may come from training a different mix of people rather than from
        the training itself.
      action: >
        Consider showing both the as-reported and the adjusted line whenever
        this trend is reported.
      success_measure: >
        The next report shows both lines side by side, and they differ by
        less than {target_gap}.
    no_finding:
      text: >
        Between {first_month} and {last_month}, "{metric_label}" moved
        {raw_change} as reported and {adjusted_change} after adjusting for
        who attended, a gap under {threshold} ({n} answers across the two
        months).

  B:
    question: Do people know when to use 988 but still wouldn't call?
    decision: >
      Add content on why people hesitate to call (what happens,
      confidentiality, 911 vs 988)?
    lever: curriculum_content
    owner_role: Curriculum
    confirmed: false
    rule: >
      Flags when {threshold} or more of respondents know when to use 988 but
      are not very likely to call.
    too_few: >
      Only {n} people answered both 'know when to use 988' and 'likely to
      call'; needs {min_n}.
    finding:
      text: >
        {gap_pct} of respondents ({gap_n} of {n}) say they know when to use
        988 but rated their chance of calling {call_cutoff} or lower (out of
        {call_max}).
      action: >
        Consider adding content on what holds people back: what happens when
        you call, confidentiality, and when to call 911 vs 988.
      success_measure: >
        The share who know when to use 988 but wouldn't call falls below
        {target_pct} next quarter, with at least {min_n} responses.
    no_finding:
      text: >
        {gap_pct} know when to use 988 but are not very likely to call
        ({gap_n} of {n} who answered both questions), under the {threshold}
        line.

  C:
    question: Is delivery more linked to intent to call than knowledge?
    decision: Invest in presenter coaching or peer observation?
    lever: presenter_coaching
    owner_role: Training
    confirmed: false
    rule: >
      Flags when the strongest delivery item is linked to willingness to
      call by {threshold} or more above the strongest knowledge item.
    too_few: >
      Only {n} people answered every item and 'likely to call'; needs
      {min_n}.
    finding:
      text: >
        How the session was delivered is more closely linked to people's
        willingness to call than what they learned (link strength
        {delivery_link} vs {knowledge_link}; higher means more closely
        linked; n = {n}). The strongest delivery item was
        "{top_delivery_item}".
      action: >
        Consider whether presenter coaching or peer observation is worth
        investing in.
      success_measure: >
        "Liked the delivery" rises from {delivery_agree_pct} to {target_pct}
        next quarter.
    no_finding:
      text: >
        Strongest delivery link {delivery_link} vs strongest knowledge link
        {knowledge_link}: delivery is not ahead by {threshold} or more (at
        least {n} answers per item).

  D:
    question: Were many already at the top before training?
    decision: >
      Offer a more advanced version for audiences who start high, or
      reword the before-training question?
    lever: audience_targeting
    secondary_lever: survey_design
    owner_role: Curriculum
    confirmed: false
    rule: >
      Flags when {threshold} or more already gave the top score on a before-
      training question.
    too_few: >
      Only {n} people answered the before-training questions; needs {min_n}.
    finding:
      text: >
        {ceiling_pct} of respondents (n = {n}) already gave the top score on
        "{item_label}" before training, so the survey can't show growth for
        them.
      action: >
        Options: offer a more advanced version for audiences who start high,
        or reword the before-training question so answers spread out more.
      success_measure: >
        Fewer than {target_pct} of respondents start at the top score on
        "{item_label}" in the next survey round.
    no_finding:
      text: >
        The highest share already at the top before training was
        {ceiling_pct} ("{item_label}", {n} answers), under the {threshold}
        line.

  E:
    question: Is a score low only because answers are blank?
    decision: Change the survey layout or make this question required?
    lever: survey_design
    owner_role: Survey Design
    confirmed: false
    rule: >
      Flags when a question is left blank in {threshold} or more of a
      month's answers, well above other months.
    too_few: >
      No month has at least {min_n} responses (largest month: {n}).
    finding:
      text: >
        In {month}, {blank_pct} of answers to "{question_label}" were left
        blank (n = {n}). A low score there may reflect missing answers rather
        than opinion.
      action: >
        Consider checking how that question appears on the survey, or making
        it required.
      success_measure: >
        Blank answers to "{question_label}" fall below {target_pct} next
        month.
    no_finding:
      text: >
        No question was blank in {threshold} or more of a month's answers
        ({n} responses in months with at least {min_n}).

  F:
    question: Are unhappy respondents silent about why?
    decision: Add a follow-up question for people who give a low rating?
    lever: survey_design
    owner_role: Survey Design
    confirmed: false
    rule: >
      Flags when {threshold} or more of people who gave a low rating leave
      no comment.
    too_few: >
      Only {n} people gave a low rating; needs {min_n}.
    finding:
      text: >
        {silent_pct} of people who gave a low rating ({low_cutoff} or below;
        {low_n} people) left no comment explaining why.
      action: >
        Consider adding a short follow-up question that appears only after a
        low rating.
      success_measure: >
        Low raters who leave no comment fall below {target_pct} after the
        change.
    no_finding:
      text: >
        {silent_pct} of the {low_n} people who gave a low rating left no
        comment, under the {threshold} line.

  G:
    question: Are fewer people writing comments?
    decision: Change when or how the survey is given?
    lever: survey_design
    owner_role: Survey Design
    confirmed: false
    rule: >
      Flags when the latest month's comment rate is {threshold} or more
      below earlier months.
    too_few: >
      Needs two months with at least {min_n} responses each; {months_ok}
      qualify (largest month: {n}).
    finding:
      text: >
        Fewer people are writing a "{field_label}": {late_rate} in
        {late_month} (n = {n_late}) vs {early_rate} in earlier months
        (n = {n_early}).
      action: >
        Consider whether the timing or format of the survey changed, for
        example being handed out as people are leaving.
      success_measure: >
        The comment rate returns to {target_pct} or higher next quarter.
    no_finding:
      text: >
        The latest month's comment rate is not {threshold} or more below
        earlier months ({n} responses in months with at least {min_n}).

  H:
    question: Is any session outside the funnel limits?
    decision: >
      Review this session's context (audience, setting, logistics) with
      the presenter?
    lever: presenter_coaching
    secondary_lever: scheduling_format
    owner_role: Training
    confirmed: false
    rule: >
      Flags a session outside the {threshold} limits for its size, i.e.
      unlikely to be chance.
    too_few: >
      No session has at least {min_n} answers (largest session: {n}).
    finding:
      text: >
        Session {session_label} ({n} responses) scored {session_value} on
        "{metric_label}", {limit_side} the usual range for a session of its
        size (typical: {centre}). Many things can explain this, such as the
        audience, room, time of day, or logistics.
      action: >
        Consider reviewing the session's context together with the presenter
        to learn what was different and whether it is worth repeating or
        adjusting.
      success_measure: >
        A context review with the presenter is held and notes are recorded
        before the next session in {county}.
    no_finding:
      text: >
        All sessions with at least {min_n} answers are inside the
        {threshold} limits for their size.

  I:
    question: Do flagged rushed answers move the headline numbers?
    decision: >
      Report headline numbers without flagged answers, and give
      participants more time?
    lever: funder_reporting
    secondary_lever: survey_design
    owner_role: Survey Design
    confirmed: false
    rule: >
      Flags when leaving out flagged answers moves a headline number by
      {threshold} or more ({threshold_nps} for NPS).
    too_few: >
      Only {n} answers to compare headline numbers; needs {min_n}.
    finding:
      text: >
        Leaving out {flagged_n} rushed or patterned answers ({flagged_pct} of
        {n}) changes "{metric_label}" from {with_flags} to {without_flags}.
      action: >
        Consider stating in reports which version is used. If many were
        completed very quickly, giving participants a few more minutes may
        help.
      success_measure: >
        Flagged answers fall below {target_pct} next quarter, and each report
        says whether flagged answers are included.
    no_finding:
      text: >
        Leaving out {flagged_n} flagged answers (of {n}) moves no headline
        number by {threshold} or more.

  J:
    question: Are people asking questions the training didn't answer?
    decision: Add these topics to the session or a handout/FAQ?
    lever: curriculum_content
    owner_role: Curriculum
    confirmed: false
    rule: >
      Flags when {threshold} or more of comments ask a question the training
      may not have answered.
    too_few: >
      Only {n} comments; needs {min_n}.
    finding:
      text: >
        {question_n} of {comment_n} comments ask a question the training may
        not have answered. The most common topic was "{top_topic}"
        ({top_topic_n} comments).
      action: >
        Consider covering it in the session or in a handout/FAQ.
      success_measure: >
        Questions about "{top_topic}" fall below {target_n} comments next
        quarter.
    no_finding:
      text: >
        {question_n} of {comment_n} comments ask a question the training may
        not have answered, under the {threshold} line.
